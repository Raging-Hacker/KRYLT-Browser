<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; connect-src 'none'"><link rel="stylesheet" href="tool.css"><title>KRYLT workspace</title></head><body>
<header><span id="title">Workspace</span><div>

<button id="reload" title="Reload service" aria-label="Reload service">↻</button>
<button id="expand" title="Expand workspace" aria-label="Expand workspace">⛶</button>
