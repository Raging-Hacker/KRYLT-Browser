<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>KRYLT</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header>
 <div class="wordmark"><img src="../assets/logo.png" alt=""><span>KRYLT</span></div>
 <div id="tabstrip" aria-label="Browser tabs"><div id="tabs" role="tablist"></div><button id="moreTabs" title="More tabs" aria-haspopup="menu" hidden>More <span id="moreCount"></span> ▾</button><button id="newTab" title="New tab (Ctrl+T)" aria-label="New tab">+</button><button id="tabSearch" title="Search tabs (Ctrl+Shift+A)" aria-label="Search all tabs">⌄</button></div>
 <div class="window"><button data-cmd="min" title="Minimize">−</button><button data-cmd="max" title="Maximize">□</button><button data-cmd="quit" title="Close">×</button></div>
</header>
<nav aria-label="Navigation">
 <button id="collapse" title="Expand sidebar" aria-label="Toggle sidebar" aria-expanded="false">☰</button>
 <button data-cmd="back" title="Back">←</button><button data-cmd="forward" title="Forward">→</button><button data-cmd="reload" title="Reload">↻</button><button id="homeButton" title="Home" aria-label="Home">⌂</button>
 <form id="addressForm"><span id="connection">⌕</span><input id="address" placeholder="Search Google or enter a URL" autocomplete="off" aria-label="Address and search"><button type="button" id="star" title="Bookmark current page">☆</button></form>
 <button id="saveLogin" title="Save login from this HTTPS page" aria-label="Save login"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="5"></circle><path d="M12 12l8 8m-4-4l3-3m-6 0l3-3"></path></svg></button>
 <button id="snapshot" title="Save page screenshot (Ctrl+Shift+S)" aria-label="Save page screenshot">▣</button>
 <button id="shield" title="Protection settings">◈ <span>Shield</span></button><button id="private" title="New private tab" aria-label="New private tab">◐</button>
</nav>
<div id="bookmarkBar" aria-label="Bookmarks bar"></div>
<aside aria-label="Tools and browser panels">
 <div class="space-label">YOUR TOOLS</div>
 <div class="app-tools">
  <button data-tool="whatsapp" title="WhatsApp"><img class="service-icon" src="../assets/services/whatsapp.svg" alt=""><span>WhatsApp</span></button>
  <button data-tool="discord" title="Discord"><img class="service-icon" src="../assets/services/discord.svg" alt=""><span>Discord</span></button>
  <button data-tool="twitch" title="Twitch"><img class="service-icon" src="../assets/services/twitch.svg" alt=""><span>Twitch</span></button>
  <button data-tool="tiktok" title="TikTok"><img class="service-icon" src="../assets/services/tiktok.svg" alt=""><span>TikTok</span></button>
  <button data-tool="studio" title="YouTube Studio"><img class="service-icon" src="../assets/services/youtubestudio.svg" alt=""><span>YouTube Studio</span></button>
  <button data-tool="music" title="YouTube Music"><img class="service-icon" src="../assets/services/youtubemusic.svg" alt=""><span>YouTube Music</span></button>
  <button data-tool="ai" title="AI service"><img class="service-icon ai-icon" src="../assets/services/openai.svg" alt=""><span class="ai-label">ChatGPT</span></button>
 </div>
 <div class="side-bottom">
  <button data-url="https://www.canva.com" title="Canva"><img class="service-icon canva-icon" src="../assets/services/canva.svg" alt=""><span>Canva</span></button>
  <button data-panel="google" title="Google services"><img class="service-icon" src="../assets/services/google.svg" alt=""><span>Google services</span></button>
  <button data-panel="passwords" title="Passwords"><svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="5"></circle><path d="M12 12l8 8m-4-4l3-3m-6 0l3-3"></path></svg><span>Passwords</span></button>
  <button data-panel="bookmarks" title="Bookmarks"><b>☆</b><span>Bookmarks</span></button>
  <button data-panel="history" title="History"><b>◷</b><span>History</span></button>
  <button data-panel="downloads" title="Downloads"><b>↓</b><span>Downloads</span></button>
  <button data-panel="resources" title="Performance"><b>◴</b><span>Performance</span></button>
  <button data-panel="settings" title="Settings"><b>⚙</b><span>Settings</span></button>
 </div>
 <div class="profile"><img src="../assets/logo.png" alt=""><span>KRYLT<small>By Cyclonix Designs</small></span></div>
</aside>
<main id="home">
 <div class="home-top"><span>YOUR SPACE. YOUR INTERNET.</span><span id="date"></span></div>
 <div class="hero"><img class="home-logo" src="../assets/logo.png" alt="KRYLT eagle"><div class="eyebrow">KRYLT</div><h1>Your world. Unleashed.</h1>
 <form id="searchForm"><span>⌕</span><input id="search" placeholder="Search Google or enter a web address" aria-label="Search Google"><button>Search ↗</button></form>
 <div class="quick">
  <button data-url="https://www.google.com"><img class="service-icon" src="../assets/services/google.svg" alt="">Google</button>
  <button data-url="https://mail.google.com"><img class="service-icon" src="../assets/services/gmail.svg" alt="">Gmail</button>
  <button data-url="https://drive.google.com"><img class="service-icon" src="../assets/services/googledrive.svg" alt="">Drive</button>
  <button data-url="https://www.youtube.com"><img class="service-icon" src="../assets/services/youtube.svg" alt="">YouTube</button>
  <button data-tool="studio"><img class="service-icon" src="../assets/services/youtubestudio.svg" alt="">Studio</button>
 </div></div>
 <footer><span>Explore on your terms.</span><span>KRYLT · Cyclonix Designs</span></footer>
</main>
<section id="panel" hidden><div class="panel-heading"><div><div class="eyebrow">KRYLT</div><h1 id="panelTitle"></h1></div><button id="closePanel">Back to browsing ↗</button></div><div id="panelBody"></div></section>
<div id="toast" role="status"></div><script src="tab-layout.js"></script><script src="ui.js"></script>
</body></html>
